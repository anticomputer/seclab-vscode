name: ci-unit

# Fast checks on every push and PR (no path filter, so it can be a required status check):
# tabd unit tests, fixture-safety lint (with self-test), patch queue, shipped-source review.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-unit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tabd unit tests (in the pinned node container)
        run: ./seclab test unit
      - name: Fixture-safety lint (self-test, then the tree)
        run: |
          test/safety/fixture-lint.sh --self-test
          ./seclab lint fixtures
      - name: Patch queue is exactly patches/series
        run: |
          build/apply-patches.sh --check
          # Injection: a second patch reusing a listed number must be refused.
          d="$RUNNER_TEMP/dup-patches"; rm -rf "$d"; cp -R patches "$d"
          first=$(grep -E '^[0-9]{4}-' patches/series | head -n 1)
          cp "$d/$first" "$d/${first%%-*}-duplicate-number.patch"
          echo "${first%%-*}-duplicate-number.patch" >> "$d/series"
          if SECLAB_PATCHES_DIR="$d" build/apply-patches.sh --check 2> "$d.err"; then
            echo "apply-patches accepted two patches numbered ${first%%-*}" >&2; exit 1
          fi
          grep -q "two patches share number ${first%%-*}" "$d.err"
      - name: Shipped sources have no test hooks (env/spawn review, dynamic loading)
        run: ./seclab lint source
      - name: Test build variants (EDR test-build-variants)
        run: |
          ./seclab test builds
          for t in desktop reh; do build/test-variant.sh record containment "$t"; done
      - name: check-release self-test (RPC policy stamp both ways; EDR rpc-policy-stamp)
        env:
          # An earlier step's container creates .work as root; scratch on the runner instead.
          SECLAB_SCRATCH: ${{ runner.temp }}
        run: sh build/check-release.sh --self-test
      - name: Dependency register self-test (the register itself is checked in docs)
        run: ./seclab lint deps --self-test
      - name: Single-file container mounts cover their imports (deps-updates, image verify)
        run: |
          ./seclab lint mounts
          ./seclab deps outdated --self-test
      - name: CFS feed config validator self-test (the shared vectors; the tree holds example values only)
        run: ./seclab cfs --self-test
      - name: Local CFS build path against a stub feed (pybuild wiring; pip-fetch with both secrets)
        run: broker/tests/cfs-path/run.sh
      # RPC capability filter (rpc-filter/AGENTS.md): policy drift, generated docs and
      # policy module in sync, probe payload lint, probe-safety guards.
      - name: RPC policy drift
        run: rpc-filter/tools/check.sh
      - name: RPC docs in sync
        run: rpc-filter/tools/docs.sh --check
      - name: RPC policy module in sync
        run: rpc-filter/tools/emit.sh --check
      - name: RPC probe payload lint
        run: rpc-filter/tools/lint.sh
      - name: RPC generator tests (order-independence, import-scoped resolution, ambiguity)
        run: rpc-filter/tools/test.sh
      - name: RPC probe-safety guards
        run: ./seclab test probe-safety
      - name: RPC URI-argument constraint (generated positions)
        run: ./seclab test uri-constraint
