name: ci-unit

# Fast checks on every push and PR (no path filter, so it can be a required status check):
# tabd unit tests, fixture-safety lint (with self-test), patch queue, shipped-source review.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-unit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tabd unit tests (in the pinned node container)
        run: ./seclab test unit
      - name: Fixture-safety lint (self-test, then the tree)
        run: |
          test/safety/fixture-lint.sh --self-test
          ./seclab lint fixtures
      - name: Patch queue is exactly patches/series
        run: build/apply-patches.sh --check
      - name: Shipped sources have no test hooks (env/spawn review, dynamic loading)
        run: ./seclab lint source
      - name: Test build variants (EDR test-build-variants)
        run: |
          ./seclab test builds
          for t in desktop reh; do build/test-variant.sh record containment "$t"; done
      - name: Dependency register self-test (the register itself is checked in docs)
        run: ./seclab lint deps --self-test
      # RPC capability filter (rpc-filter/AGENTS.md): policy drift, generated docs and
      # policy module in sync, probe payload lint, probe-safety guards.
      - name: RPC policy drift
        run: rpc-filter/tools/check.sh
      - name: RPC docs in sync
        run: rpc-filter/tools/docs.sh --check
      - name: RPC policy module in sync
        run: rpc-filter/tools/emit.sh --check
      - name: RPC probe payload lint
        run: rpc-filter/tools/lint.sh
      - name: RPC generator tests (order-independence, import-scoped resolution, ambiguity)
        run: rpc-filter/tools/test.sh
      - name: RPC probe-safety guards
        run: ./seclab test probe-safety
      - name: RPC URI-argument constraint (generated positions)
        run: ./seclab test uri-constraint
