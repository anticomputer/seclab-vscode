name: liveness-refresh

# Liveness evidence that is about to lapse (EDR liveness-gate). Actions runs are deleted at the
# retention horizon; the required workflow-lint check only notes a run past day 75 and degrades a
# deleted one to a note, so it never blocks a PR on age. This weekly job fails instead, listing
# every entry due for refresh, so each is re-run and its register entry updated before day 85.
# It also lists the security findings baseline (open highs the ratchet still allows) and every
# register citation that no longer resolves in the job summary, so they stay visible every week.
# Not a required check. It runs on every push that changes it, the liveness code or the findings
# register, so it is never a dispatch-only workflow that nothing has run (the gate's own rule).
on:
  schedule:
    - cron: '41 7 * * 1'
  push:
    paths:
      - .github/workflows/liveness-refresh.yml
      - build/liveness/**
      - build/docs/findings.ts
      - docs/security-reviews/findings.json
      - seclab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liveness-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # reads the Actions runs the register cites
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Liveness evidence due for refresh (register only; fails if any is due)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # The banner proves --refresh reached the checker; without it the job would pass on age (MMM-2).
        run: |
          ./seclab liveness verify-runs --refresh | tee "$RUNNER_TEMP/refresh.txt"
          grep -qx 'liveness: refresh mode' "$RUNNER_TEMP/refresh.txt"

  # The findings baseline (EDR security-findings-register): every open high/critical the ratchet
  # still allows, listed weekly so none goes quiet. Its own job (review RRR-1, RRR-4): no token, no
  # actions: read, and a register problem can't stop the liveness listing above. It fails when a
  # baseline key doesn't resolve (RRR-2), and the header check proves the listing ran.
  findings-baseline:
    name: findings baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Full history and every branch: the citation listing resolves commits on origin/* (review ZZZ).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Listings, not alarms: open highs and rotted citations are printed and the job passes. It
      # fails only on a defect in the listing itself, or on a baseline larger than a week ago (the
      # docs gate already refuses growth; this catches anything that got past it).
      - name: Open high/critical findings still in the baseline (offline container)
        shell: bash
        run: |
          ./seclab findings baseline | tee "$RUNNER_TEMP/baseline.md"
          grep -q '^## Security findings baseline: [0-9][0-9]* open high/critical$' "$RUNNER_TEMP/baseline.md"
          cat "$RUNNER_TEMP/baseline.md" >> "$GITHUB_STEP_SUMMARY"
      - name: The baseline didn't grow over the last week
        shell: bash
        run: |
          now="$(sed -n 's/^## Security findings baseline: \([0-9][0-9]*\) open high\/critical$/\1/p' "$RUNNER_TEMP/baseline.md")"
          # Anchored on the register's own history (AAAA-5): its last change over a week old, else
          # its first commit; a register with no history here fails rather than skipping.
          reg=docs/security-reviews/findings.json
          old="$(git rev-list -1 --before='7 days ago' HEAD -- "$reg")"
          [[ -n "$old" ]] || old="$(git rev-list --reverse HEAD -- "$reg" | head -1)"
          [[ -n "$old" ]] && git cat-file -e "$old:$reg"
          was="$(git show "$old:$reg" | jq '.baseline | length')"
          echo "baseline: $now now, $was a week ago (${old:0:12})"
          [[ "$now" =~ ^[0-9]+$ && "$was" =~ ^[0-9]+$ ]]
          [[ "$now" -le "$was" ]]
      # Rot is listed for the owning sessions to remap; only a defect in the listing (exit 2) fails.
      - name: Register citations that no longer resolve
        if: always()
        shell: bash
        run: |
          rc=0
          ./seclab findings rot 2>&1 | tee "$RUNNER_TEMP/rot.txt" || rc=$?
          # An indented block with backticks stripped: register text can't break out of it (ZZZ-4).
          { echo '## Register citations that no longer resolve'; echo; grep -E 'cites|no rotted' "$RUNNER_TEMP/rot.txt" | tr -d '`' | sed 's/^/    /' || true; } >> "$GITHUB_STEP_SUMMARY"
          [[ $rc -le 1 ]]
