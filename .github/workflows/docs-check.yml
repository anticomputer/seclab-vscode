name: docs-check

# Docs are part of the change (EDR docs-check). On every push and PR:
# - records, generated indexes, relative links, SHA-pinned permalinks and ARCHITECTURE
#   consistency (offline, in a node container);
# - the broker's own docs check, including running its documented commands;
# - runnable blocks (<!-- ci: run -->) in AGENTS.md and the READMEs;
# - external links resolve (lychee, cached between runs);
# - paired doc changes for protocol, patch, provider and product.json changes.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  # PRs and branches: newest push wins. main: every SHA is checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ALPINE: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f

jobs:
  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Link-check cache: keyed per ref, restored read-only on PRs (never saved from a PR,
      # so PR content can't seed what main or a tag restores).
      - name: Restore the link-check cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/lychee-cache
          key: lychee-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            lychee-${{ github.ref }}-
            lychee-refs/heads/main-
      - name: Seed the lychee cache volume
        run: |
          docker volume create seclab-lychee-cache >/dev/null
          if [ -f .work/lychee-cache/.lycheecache ]; then
            docker run --rm -v seclab-lychee-cache:/cache -v "$PWD/.work/lychee-cache:/in:ro" "$ALPINE" cp /in/.lycheecache /cache/
          fi
      - name: Docs gate (records, links, commands, paired docs)
        env:
          # Exact range: the PR's base, or the push's previous head (all-zero for a new branch).
          DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./seclab docs check --run-commands --paired
      - name: External links resolve
        # No token: lychee is a third-party image, so it gets no credentials. GitHub rate
        # limits are absorbed by the cache and by accepting 429.
        run: ./seclab docs check --online
      - name: Export the lychee cache
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p .work/lychee-cache
          docker run --rm -v seclab-lychee-cache:/cache:ro -v "$PWD/.work/lychee-cache:/out" "$ALPINE" sh -c 'cp /cache/.lycheecache /out/ 2>/dev/null || true'
      - name: Save the link-check cache
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .work/lychee-cache
          key: lychee-${{ github.ref }}-${{ github.run_id }}
