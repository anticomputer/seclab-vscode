name: headless-linux

# Headless editor tests (EDR headless-driver): the Linux editor built in the builder container,
# then driven under Xvfb in a container over its CDP pipe (./seclab test driver). No OS privacy
# permissions, no host display, no network in the test container. Not a required check yet.

on:
  workflow_dispatch:
  push:
    paths:
      - upstream.lock
      - build/**
      - patches/**
      - extensions/**
      - test/driver/**
      - test/harness.ts
      - seclab
      - .github/workflows/headless-linux.yml

permissions:
  contents: read

concurrency:
  group: headless-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  driver:
    name: driver
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Linux editor (container, pinned upstream; runs check-release --desktop)
        run: ./seclab build linux editor
      - name: Driver self-test under Xvfb (CDP pipe; no network)
        run: ./seclab test driver
      - name: Keep the self-test screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver-selftest
          path: .work/driver/selftest.png
          if-no-files-found: ignore
          retention-days: 7
