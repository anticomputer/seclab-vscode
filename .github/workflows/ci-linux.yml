name: ci-linux

# Linux CI: unit tests, REH build in the builder container, OCI tab images, and the
# OCI-provider end-to-end + containment suites. (sbx needs nested virtualisation, which
# hosted runners lack; the sbx suite runs locally: ./seclab test containment sbx.)
on:
  workflow_dispatch:
  push:
    paths:
      - upstream.lock
      - build/**
      - patches/**
      - extensions/**
      - tabd/**
      - sandbox/**
      - test/**
      - seclab
      - .github/workflows/ci-linux.yml

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tabd unit tests (in the pinned node container)
        run: ./seclab test unit
      - name: Fixture-safety lint
        run: ./seclab lint fixtures
      - name: Patch queue is exactly patches/series
        run: build/apply-patches.sh --check
      - name: Shipped sources have no test hooks (env/spawn review, dynamic loading)
        run: ./seclab lint source

  oci:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Build REH (container, pinned upstream)
        run: ./seclab build linux reh
      - name: Release check (no test hooks in the REH)
        run: build/check-release.sh .work/out/seclab-reh-linux-*.tar.gz
      - name: Build OCI tab images
        run: ./seclab image oci
      - name: tabd end-to-end (OCI)
        run: ./seclab test e2e oci
      - name: Containment suite (OCI)
        run: ./seclab test containment oci
      - name: Canary acceptance test (OCI)
        run: ./seclab test canary oci
      - name: Pre-mount secret scan (OCI)
        run: ./seclab test secrets oci
