name: ci-linux

# Linux CI, heavy part: REH build in the builder container, OCI tab images, and the
# OCI-provider end-to-end + containment suites, on changes to code that affects them.
# (sbx needs nested virtualisation, which hosted runners lack; the sbx suite runs locally:
# ./seclab test containment sbx.) The fast unit/lint job is ci-unit.yml (every push).
on:
  workflow_dispatch:
  push:
    paths:
      - upstream.lock
      - build/**
      - patches/**
      - extensions/**
      - tabd/**
      - sandbox/**
      - test/**
      - seclab
      - rpc-filter/**
      - .github/workflows/ci-linux.yml
  pull_request:
    paths:
      - upstream.lock
      - build/**
      - patches/**
      - extensions/**
      - tabd/**
      - sandbox/**
      - test/**
      - seclab
      - rpc-filter/**
      - .github/workflows/ci-linux.yml

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  # PRs and branches: newest push wins. main: every SHA is checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The RPC attack-surface inventory regenerated from the exact source the build uses
  # (build/fetch-upstream.sh: upstream.lock SHA, tag verified); any diff fails, so the
  # drift gate compares the policy with what ships, not with a committed artefact.
  rpc-inventory:
    name: rpc-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned upstream (verifies tag -> SHA)
        run: build/fetch-upstream.sh "$GITHUB_WORKSPACE/.work/upstream-src"
      - name: Regenerate the inventory from it; fail on any diff
        run: |
          rpc-filter/tools/run.sh "$GITHUB_WORKSPACE/.work/upstream-src"
          git diff --exit-code rpc-filter/inventory/
          # git diff misses untracked files (review B-1).
          test -z "$(git status --porcelain -- rpc-filter/inventory/)"
      - name: Policy drift against the regenerated inventory
        run: rpc-filter/tools/check.sh

  oci:
    name: oci
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Teardown regression (orphaned editor tree, leftover tab pod, refused run.json)
        run: node test/containment/teardown.test.ts
      - name: Build REH (container, pinned upstream)
        run: ./seclab build linux reh
      - name: Release check (no test hooks in the REH)
        run: build/check-release.sh .work/out/seclab-reh-linux-*.tar.gz
      - name: Build OCI tab images
        run: ./seclab image oci
      - name: tabd end-to-end (OCI)
        run: ./seclab test e2e oci
      - name: Containment suite (OCI)
        run: ./seclab test containment oci
      - name: Canary acceptance test (OCI)
        run: ./seclab test canary oci
      - name: Pre-mount secret scan (OCI)
        run: ./seclab test secrets oci
      - name: Tab observability (OCI; Falco, signature-verified by ./seclab image oci)
        run: ./seclab test obs oci
