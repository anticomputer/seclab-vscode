name: build-macos

# Builds the unsigned darwin-arm64 editor from the pinned upstream + product.json
# overrides + patch queue + our built-in extensions. Fetch with `./seclab fetch macos`,
# which verifies the build provenance attestation before anything is extracted.
# Release artifacts come only from main (EDR ci-hardening); never from a PR (no
# pull_request trigger). A manual dispatch on another branch is a test build: attested, and
# uploaded under a separate `-branch` artifact name that only `./seclab fetch macos-branch`
# reads (verified against that branch, extracted outside the release location).
on:
  workflow_dispatch:
  push:
    # Release builds: main only. (Tags come back with a ruleset restricting v* tag creation
    # to reviewed main SHAs; until then a tag push could attest an unreviewed commit: CI-1.)
    branches: [main]
    paths:
      - upstream.lock
      - build/**
      - patches/**
      - extensions/**
      - tabd/**
      - .github/workflows/build-macos.yml

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  # Never cancel a main build: every reviewed SHA gets its artifact.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write      # Sigstore signing of the provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned upstream (verifies tag -> SHA)
        run: build/fetch-upstream.sh "$GITHUB_WORKSPACE/vscode"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: vscode/.nvmrc
          package-manager-cache: false

      - name: Build unsigned app (includes the release check for test hooks)
        env:
          ARCH: arm64
          SRC: ${{ github.workspace }}/vscode
          OUT_DIR: ${{ github.workspace }}/dist
        run: build/build-darwin.sh

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/seclab-vscode-darwin-arm64.zip
            dist/build-info.json

      - name: Upload (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seclab-vscode-darwin-arm64
          path: dist/
          retention-days: 7
          if-no-files-found: error

      # A dispatched build of another branch, for testing unlanded patches (e.g. the RPC core
      # filter) in the real app. A separate artifact name that `./seclab fetch macos` (releases)
      # never reads; `./seclab fetch macos-branch RUN` verifies its attestation against that
      # branch and extracts it outside the release location. Short retention; never released.
      - name: Upload branch test build (dispatch, not main)
        if: github.ref != 'refs/heads/main' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seclab-vscode-darwin-arm64-branch
          path: dist/
          retention-days: 3
          if-no-files-found: error
