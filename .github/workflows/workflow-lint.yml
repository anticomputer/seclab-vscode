name: workflow-lint

# CI/CD hardening gate (EDR ci-hardening), on every push and PR: a gitleaks scan of what the push
# adds (AGENTS.md: mechanical, also the pre-push hook), workflow static analysis (actionlint,
# zizmor) and the digest/SHA pin check over the whole tree.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # liveness gate: reads the Actions runs its register cites
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tool build checks self-test (both gitleaks binaries required on this amd64 runner)
        run: build/tools/tool.sh --self-test
      - name: No secret in any commit main doesn't have yet (gitleaks built from pinned source)
        env:
          # Pushes to main scan from the previous head; everything else scans every commit since
          # the merge base with main, so a secret pushed earlier on a branch can't ride a later,
          # clean push onto main (review VV-2).
          SECRETS_BASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before || '' }}
        run: ./seclab lint secrets
      - name: Pin check self-test
        run: ./seclab lint pins --self-test
      - name: Every image and action is pinned by digest/SHA
        run: ./seclab lint pins
      - name: No pin younger than 7 days (CFS hold; EDR pin-age-cooldown)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./seclab lint pin-age
      - name: actionlint + zizmor (offline, no token)
        # Both verified before use without a token: actionlint against its committed attestation
        # bundle, zizmor's image signature with our pinned cosign (build/tools/tool.sh).
        run: ./seclab lint workflows
      # EDR liveness-gate: every exported value, in-tab program, test hook, fixture and
      # dispatch-only workflow names what runs it, with evidence it ran. The self-test injects
      # the five recorded failures first; the check runs offline, then reads the named runs.
      - name: Liveness gate self-test
        run: ./seclab liveness --self-test
      - name: Liveness gate (offline)
        run: ./seclab liveness check
      - name: Liveness gate (the recorded Actions runs exist and succeeded)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./seclab liveness check --verify-runs
