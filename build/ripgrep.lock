# pinned by sha256 and placed in its cache before `npm ci` (build/seed-ripgrep.mjs). The
# postinstall then uses the cache: it never calls the GitHub API (which rate-limits shared
# runners: 403) and never installs an unverified binary. Not attested upstream (2026-11-05).
